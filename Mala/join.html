<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mala - 加入共修小组</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; min-height: 100vh;
           margin: 0; background: #faf7f4; color: #333; text-align: center; padding: 20px; }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; color: #8B4513; }
    p { color: #666; margin: 0 0 24px; }
    .btn { background: #8B4513; color: white; padding: 14px 32px; border-radius: 8px;
           text-decoration: none; font-size: 16px; display: inline-block; }
  </style>
  <script>
    function openApp() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        window.location.href = 'mala://join?code=' + encodeURIComponent(code);
      }
    }
    window.onload = function() { openApp(); };
  </script>
</head>
<body>
  <div class="emoji">🙏</div>
  <h1>加入共修小组</h1>
  <p>点击下方按钮，在 Mala App 中加入小组</p>
  <a class="btn" href="#" onclick="openApp(); return false;">打开 Mala App</a>
  <p style="margin-top:24px; font-size:13px; color:#999">
    如果 App 没有自动打开，请先安装 Mala，再点击链接
  </p>
</body>
</html>
